[plugin]

name="godot_rtmidi"
description="Adds godot_rtmidi's Android library to Android exports, so MIDI ports can be opened and Bluetooth MIDI devices connected on Android. Requires \"Use Gradle Build\" in the Android export preset. Not needed for other platforms."
author="Malik Enes Şafak"
version="0.0.4"
script="plugin.gd"
