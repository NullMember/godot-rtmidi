name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04 # Oldest available runner = widest glibc compatibility
            platform: linux
            slug: linux-x86_64
            apt: libasound2-dev

          - name: Linux arm64
            os: ubuntu-22.04-arm
            platform: linux
            slug: linux-arm64
            apt: libasound2-dev

          # Not packaged: only checks that the opt-in JACK backend still builds.
          - name: Linux x86_64 (JACK, build check)
            os: ubuntu-22.04
            platform: linux
            slug: linux-x86_64-jack
            apt: libasound2-dev libjack-jackd2-dev
            config-flags: -DGODOT_RTMIDI_JACK=ON
            no-package: true

          - name: Windows x86_64
            os: windows-2022
            platform: windows
            slug: windows-x86_64
            config-flags: -A x64

          - name: Windows x86_32
            os: windows-2022
            platform: windows
            slug: windows-x86_32
            config-flags: -A Win32

          - name: macOS universal
            os: macos-latest
            platform: macos
            slug: macos-universal

          - name: iOS (device + simulator)
            os: macos-latest
            platform: ios
            slug: ios

          # Android's MIDI API (AMidi) needs API level 29.
          - name: Android arm64
            os: ubuntu-22.04
            platform: android
            slug: android-arm64
            android-abi: arm64-v8a

          - name: Android x86_64
            os: ubuntu-22.04
            platform: android
            slug: android-x86_64
            android-abi: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # A bare `cmake --build --parallel` runs `make -j` with no limit, which
      # exhausts the macOS runners' process limit ("fork: Resource temporarily unavailable").
      - name: Limit build parallelism to the CPU count
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   n=$(nproc) ;;
            macOS)   n=$(sysctl -n hw.ncpu) ;;
            Windows) n=$NUMBER_OF_PROCESSORS ;;
          esac
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$n" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Set up Android NDK
        if: matrix.platform == 'android'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b
          link-to-sdk: true

      - name: Build
        if: matrix.platform != 'ios'
        shell: bash
        run: |
          set -euo pipefail
          flags="${{ matrix.config-flags }}"
          if [ "${{ matrix.platform }}" = "android" ]; then
            flags="$flags --toolchain ${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake -DANDROID_ABI=${{ matrix.android-abi }} -DANDROID_PLATFORM=29"
          fi
          for target in template_debug template_release; do
            cmake -S . -B "build-$target" -DCMAKE_BUILD_TYPE=Release -DGODOTCPP_TARGET=$target $flags
            cmake --build "build-$target" --config Release
          done

      # RtMidi's Java helper classes, added to Gradle builds by the editor plugin.
      # Built once (not per ABI) so the merged artifacts have a single copy.
      - name: Build Android library (.aar)
        if: matrix.slug == 'android-arm64'
        shell: bash
        run: android/build_aar.sh

      - name: Build (iOS)
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          addon=demo/addons/godot_rtmidi/ios
          for target in template_debug template_release; do
            lib="godot_rtmidi.ios.$target.arm64.dylib"
            # Device and simulator builds produce the same file name; stage each one.
            for platform in OS64 SIMULATORARM64; do
              cmake -S . -B "build-$target-$platform" \
                --toolchain extern/godot-cpp/cmake/ios.toolchain.cmake \
                -DPLATFORM=$platform -DDEPLOYMENT_TARGET=12.0 \
                -DCMAKE_BUILD_TYPE=Release -DGODOTCPP_TARGET=$target
              cmake --build "build-$target-$platform"
              mkdir -p "stage/$platform"
              cp "bin/ios/$lib" "stage/$platform/"
            done
            rm -f "$addon/$lib"
            xcodebuild -create-xcframework \
              -library "stage/OS64/$lib" \
              -library "stage/SIMULATORARM64/$lib" \
              -output "$addon/godot_rtmidi.ios.$target.xcframework"
          done

      # Only for releases and manual runs: notarization takes a few minutes, and
      # pull requests from forks don't get access to secrets.
      # iOS libraries don't need this: Xcode re-signs embedded frameworks with
      # the game developer's identity when the game is exported.
      - name: Sign and notarize (macOS)
        if: matrix.platform == 'macos' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERTIFICATE_P12" ] || [ -z "$NOTARY_API_KEY" ]; then
            echo "::warning::Signing secrets are not set; the macOS libraries are not signed or notarized."
            exit 0
          fi

          # Import the certificate into a temporary keychain.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          echo "$NOTARY_API_KEY" | base64 --decode > "$RUNNER_TEMP/notary_key.p8"
          NOTARY_API_KEY_PATH="$RUNNER_TEMP/notary_key.p8" \
            .github/scripts/macos-sign-notarize.sh demo/addons/godot_rtmidi/macos

      - name: Remove signing keychain
        if: always() && matrix.platform == 'macos'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary_key.p8"

      - name: List built libraries
        shell: bash
        run: ls -la demo/addons/godot_rtmidi/${{ matrix.platform }}/

      - name: Upload libraries
        if: ${{ !matrix.no-package }}
        uses: actions/upload-artifact@v7
        with:
          name: lib-${{ matrix.slug }}
          # The common parent (demo/addons/godot_rtmidi) is stripped, so the
          # artifact keeps the <platform>/ folder.
          path: demo/addons/godot_rtmidi/*/*godot_rtmidi.*
          if-no-files-found: error

  package:
    name: Package addon
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Only needed to create the release on tags
    steps:
      - name: Checkout (submodules for their license files)
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Download libraries
        uses: actions/download-artifact@v8
        with:
          pattern: lib-*
          path: demo/addons/godot_rtmidi
          merge-multiple: true

      - name: Assemble addon
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

          addon=dist/addons/godot_rtmidi
          mkdir -p dist/addons
          cp -r demo/addons/godot_rtmidi "$addon"
          find dist -name .gitkeep -delete
          cp README.md LICENSE.md "$addon/"
          cp extern/rtmidi/LICENSE "$addon/LICENSE.rtmidi.txt"
          cp extern/godot-cpp/LICENSE.md "$addon/LICENSE.godot-cpp.md"
          find dist -type f | sort

          (cd dist && zip -r "../godot-rtmidi-$version.zip" addons)

      - name: Upload addon
        uses: actions/upload-artifact@v7
        with:
          name: godot-rtmidi-${{ env.VERSION }}
          path: dist/

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "godot-rtmidi-$VERSION.zip" \
            --draft --generate-notes --title "Version $VERSION"
